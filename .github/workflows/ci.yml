name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/ritsuki-kagerou/crt-ui

jobs:
  verify:
    name: check + unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # let every Node version finish, so a failure shows whether it is
      # version-specific or not
      fail-fast: false
      matrix:
        # vitest 5 and jsdom 30 need Node ^22 || ^24 — see their `engines`
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      # reads the pnpm version from `packageManager` in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm lint

      - name: Typecheck the library
        run: pnpm check

      # the SSR test app imports the package through dist/, which only
      # exists after packaging
      - name: Build the package
        run: pnpm package

      - name: Typecheck the SSR test app
        run: pnpm check:app

      # `ssr` renders every component in plain Node and records the markup;
      # `hydration` mounts the browser build and must land on the same markup.
      - name: SSR and hydration unit tests
        run: pnpm test

      - name: Build the docs site
        run: pnpm build

  hydration:
    name: hydration (real browser)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # a fresh Ubuntu runner lacks the system libraries Chromium needs
      - name: Install Chromium
        run: pnpm --filter crt-ui-ssr-app exec playwright install --with-deps chromium

      # Builds dist/, then runs the SvelteKit app twice — once under `vite dev`,
      # where Svelte still emits hydration_mismatch / hydration_attribute_changed
      # / hydration_html_changed, and once against the production build. The
      # spec fails the job on any console warning or error.
      - name: SSR + hydration integration tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/ssr-app/playwright-report
          retention-days: 7

  # ── Docs site → crt-ui.ritsuki.dev ────────────────────────────
  # Only after every check above has passed, and only for pushes to main.
  # Pull requests (including ones from forks) never build or deploy.

  image:
    name: build docs image
    needs: [verify, hydration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The repo is public, so everything that identifies the VM lives in the
  # `production` environment's secrets, which GitHub only releases to jobs
  # running on main. On the VM, DEPLOY_SSH_KEY can only run
  # `deploy-app crt-ui <tag>` (forced command): no shell, no other app.
  deploy:
    name: deploy to VM
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Run deploy-app on the VM
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          # `ssh-keyscan -p <port> -t ed25519 <host>`, pinned so the
          # connection cannot be redirected
          VM_HOST_KEY: ${{ secrets.VM_HOST_KEY }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VM_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -p "$VM_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "deploy@$VM_HOST" "$TAG"
